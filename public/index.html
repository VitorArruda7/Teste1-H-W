<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Processamento de Pedidos - H&W</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div>
          <h1>Fila de Processamento de Pedidos</h1>
          <p id="status-pill" class="status-pill">Aguardando execução</p>
        </div>
        <div class="controls">
          <button id="run-button" class="action run">Executar</button>
          <button id="reset-button" class="action reset">Reset</button>
        </div>
      </header>

      <section>
        <h2 class="section-title">Resumo do Último Processo</h2>
        <div id="summary" class="empty-state">
          Execute o processamento para visualizar os resultados.
        </div>
      </section>

      <section>
        <h2 class="section-title">Logs de Execução</h2>
        <div id="logs" class="log-panel"></div>
      </section>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
